@if (isLoading()) {
  <div class="d-flex justify-content-center mt-5">
    <mat-spinner diameter="48" />
  </div>
} @else if (isAuthenticated(); as authenticated) {
  @let u = user();
  @if (u) {
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Welcome, {{ u.name || u.email }}</mat-card-title>
        <mat-card-subtitle>{{ u.email }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (u.picture) {
          <img [src]="u.picture" [alt]="u.name" class="avatar" />
        }
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="warn" (click)="logout()">Log out</button>
      </mat-card-actions>
    </mat-card>
  }
} @else {
  @let err = error();
  @if (err) {
    <p class="text-danger mb-3">{{ err.message }}</p>
  }
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign in to Quiniela</mat-card-title>
      <mat-card-subtitle>Log in or create an account to get started</mat-card-subtitle>
    </mat-card-header>
    <mat-card-actions>
      <button mat-flat-button (click)="login()">Log in</button>
      <button mat-stroked-button (click)="signup()">Sign up</button>
    </mat-card-actions>
  </mat-card>
}
